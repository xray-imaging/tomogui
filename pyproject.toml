[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomogui"
version = "1.0.0"
description = "GUI interface for TomoCuPy and TomoLog"
authors = [
    {name = "Xiaoyang Liu", email = "XXX@XXX.gov"},
    {name = "Alberto Mittone", email = "amittone@anl.gov"}
]
license = "MIT"
requires-python = ">=3.8,<3.13"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.10.0",
    "vispy>=0.14.0",
    "PyOpenGL>=3.1.0",
    "PyQt5>=5.15.0",
    "Pillow>=8.0.0",
    "h5py>=3.0.0",
    "pyqtgraph>=0.13.3",
    "matplotlib>=3.5.0",
    "tifffile>=2023.1",
    "psutil>=5.9",
    "torch>=2.0.0",
    "einops>=0.6.0",
    "timm>=0.9",
]

[project.optional-dependencies]
chatbot = ["anthropic>=0.40"]
# External reconstruction / logging backends — not on PyPI as deps because
# they need the full CUDA stack (tomocupy) or source install (tomolog). See
# docs/user_guide/installation.rst for the recommended conda recipe.

[project.scripts]
tomogui = "tomogui.__main__:main"
tomogui-cli = "tomogui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tomogui = ["styles/*.py", "chatbot_knowledge.md"]